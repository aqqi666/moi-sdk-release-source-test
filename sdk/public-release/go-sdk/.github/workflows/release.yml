name: Release SDK

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fetch and build this exact public tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          test -n "$TAG"
          MODULE=$(go list -m)
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          go mod init consumer
          go get "$MODULE@$TAG"
          printf 'package main\n\nimport _ "%s"\n\nfunc main() {}\n' "$MODULE" > main.go
          go mod tidy
          go build .
